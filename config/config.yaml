experiment:
  name: "cvae_training"
  device: "cuda"   # "cpu" or "cuda"
  seed: 42
  size_k_folds: 5

dataset:
  name: "wine"      # iris | wine | breast_cancer
  test_size: 0.2
  val_size: 0.2
  scaler: "minmax"

model:
  input_dim: null        # auto-set at runtime
  hidden_dim_factor: 3   # hidden_dim = input_dim * factor
  latent_dim_factor: 0.5 # latent_dim = floor(input_dim * factor)
  activation: "relu"
  output_activation: "sigmoid"

training:
  batch_size: 32
  epochs: 500
  learning_rate: 0.001
  gradient_clip_norm: 1.0

optimizer:
  name: "adam"
  lr: 0.001
  weight_decay: 0.0

lr_scheduler:
  name: "ReduceLROnPlateau"
  mode: "min"
  factor: 0.5
  patience: 150

early_stopping:
  enabled: true
  patience: 50
  metric: "val_loss"

loss:
  name: "vae_loss"
  beta: 1.0

paths:
  model_dir: "model"
  data_dir: "data"
  image_dir: "img"
  results_dir: "results"
  model_file: "cvae_{dataset}.pth"
  scaler_file: "scaler_{dataset}.pkl"
  config_file: "config_{dataset}.pkl"

logging:
  print_every: 100
  save_best_only: true
  save_learning_curves: true
